<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Manifesto PM Unlocked: composição do vídeo</title>
<!--
  Composição do vídeo do Manifesto (fora do build do site).
  - Pré-visualização: abrir no navegador (?v=1 para a versão vertical 1080×1920).
  - Gravação: record.mjs chama window.render(t) fotograma a fotograma (determinístico) e o ffmpeg junta os fotogramas.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet">
<style>
  :root { --bg: #0C0E12; --amber: #FFB627; --ink: #F4F2EE; --mute: #A9AFB8; --line: rgba(255,255,255,.09); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  /* grelha subtil e vinheta */
  .grid { position: absolute; inset: -10%; background-image:
      linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 80px 80px; opacity: .45;
    mask-image: radial-gradient(ellipse at 50% 45%, #000 20%, transparent 75%); }
  .glow { position: absolute; width: 1100px; height: 1100px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,182,39,.13), rgba(255,182,39,0) 62%); filter: blur(10px); }
  .grain { position: absolute; inset: 0; opacity: .07; pointer-events: none; mix-blend-mode: overlay; }
  .cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .h { font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 800; letter-spacing: -.025em; }
  .eyebrow { font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); font-size: 22px; }

  /* barra de topo */
  .top { position: absolute; left: 120px; right: 120px; top: 72px; display: flex; justify-content: space-between; align-items: center;
    font-size: 22px; color: var(--mute); }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; color: var(--ink); }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 14px rgba(255,182,39,.7); display: inline-block; }
  .counter { font-family: 'Plus Jakarta Sans'; font-weight: 700; letter-spacing: .2em; font-variant-numeric: tabular-nums; }
  .counter b { color: var(--amber); font-weight: 700; }
  .bar { width: 260px; height: 3px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .bar div { height: 100%; background: var(--amber); transform-origin: left; }

  /* linha contínua com cabeça brilhante */
  .rail { position: absolute; left: 120px; right: 120px; bottom: 120px; height: 2px; background: rgba(255,255,255,.08); }
  .rail .fill { position: absolute; left: 0; top: 0; height: 2px; background: var(--amber); transform-origin: left; width: 100%; }
  .rail .head { position: absolute; top: -6px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--amber);
    box-shadow: 0 0 0 6px rgba(255,182,39,.15), 0 0 28px rgba(255,182,39,.8); }
  .rail .tick { position: absolute; top: -4px; width: 2px; height: 10px; background: rgba(255,255,255,.2); }

  /* abertura e fecho */
  .intro, .outro { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 120px; }
  .intro h1 { font-size: 132px; line-height: 1.02; margin-top: 28px; max-width: 1300px; }
  .intro p { font-size: 34px; color: var(--mute); margin-top: 34px; }
  .outro { align-items: flex-start; }
  .outro h2 { font-size: 112px; line-height: 1; }
  .outro p { font-size: 40px; color: var(--mute); margin-top: 28px; }
  /* assinatura em texto simples (nada com aspeto de botão: o vídeo não é clicável) */
  .outro .cta { margin-top: 44px; display: block; color: var(--amber); font-weight: 600; font-size: 34px; letter-spacing: .01em; }
  .outro svg { position: absolute; right: 120px; top: 50%; width: 640px; height: 640px; margin-top: -320px; overflow: visible; }

  /* cena de cada pilar */
  .scene { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 760px; align-items: center; gap: 100px; padding: 0 120px; }
  .num { width: 420px; height: 230px; overflow: visible; display: block; margin-left: -12px; }
  .num text { font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: 260px; letter-spacing: -.04em; }
  .scene h3 { font-size: 92px; line-height: 1.02; margin-top: 18px; }
  .scene p { font-size: 38px; line-height: 1.45; color: var(--mute); margin-top: 26px; max-width: 820px; }
  .panel { position: relative; width: 760px; height: 540px; overflow: visible; }
  .panel::before { content: ''; position: absolute; inset: 8% 6%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,182,39,.10), rgba(255,182,39,0)); }
  .panel svg { position: absolute; left: 0; top: 27px; width: 760px; height: 486px; overflow: visible; }
  .panel svg text { font-family: Inter; }

  /* versão vertical */
  body.vert .top { left: 80px; right: 80px; top: 90px; }
  body.vert .rail { left: 80px; right: 80px; bottom: 110px; }
  body.vert .intro, body.vert .outro { padding: 0 80px; }
  body.vert .intro h1 { font-size: 112px; }
  body.vert .scene { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; gap: 70px; padding: 0 80px; }
  body.vert .scene p { font-size: 40px; }
  body.vert .panel { width: 920px; height: 620px; }
  body.vert .panel svg { width: 920px; height: 566px; }
  body.vert .outro { justify-content: flex-start; padding-top: 360px; }
  body.vert .outro svg { right: 50%; margin-right: -340px; top: auto; bottom: 240px; margin-top: 0; width: 680px; height: 680px; }
  /* texto escrito ao ritmo da voz: palavras por dizer escondidas, cursor âmbar à frente */
  .w { display: inline; }
  .cur { display: inline-block; width: 4px; height: .95em; margin-left: 6px; vertical-align: -0.12em; border-radius: 2px;
    background: var(--amber); box-shadow: 0 0 12px rgba(255,182,39,.55); }
  .said { color: var(--ink); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="cam" id="cam">
    <div class="glow" id="glow"></div>
    <div class="grid"></div>
  </div>
  <svg class="grain" width="100%" height="100%" aria-hidden="true">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="top" id="top">
    <div class="brand"><i></i> PM Unlocked · Manifesto</div>
    <div>
      <div class="counter" id="counter"><b>01</b> / 08</div>
      <div class="bar"><div id="bar"></div></div>
    </div>
  </div>

  <div class="intro" id="intro">
    <div class="eyebrow">Manifesto</div>
    <h1 class="h" style="color:var(--amber)">O que nos une</h1>
    <p>Oito princípios da PM Unlocked para crescer em comunidade.</p>
  </div>

  <div id="scenes"></div>

  <div class="outro" id="outro">
    <div class="eyebrow">PM Unlocked</div>
    <h2 class="h" style="margin-top:24px">Oito princípios.<br>Uma comunidade.</h2>
    <p>Gestão de projetos, carreira em TI e a vida em Portugal.</p>
    <div class="cta">Entre na comunidade em alexseles.online</div>
    <svg id="ring" viewBox="-320 -320 640 640"></svg>
  </div>

  <div class="rail" id="rail"><div class="fill" id="railFill"></div><div class="head" id="railHead"></div></div>
</div>

<script src="out/words.js"></script>
<script>
const VERT = new URLSearchParams(location.search).get('v') === '1';
if (VERT) {
  document.body.classList.add('vert');
  for (const n of [document.documentElement, document.body]) { n.style.width = '1080px'; n.style.height = '1920px'; }
}
const W = VERT ? 1080 : 1920;

const PILLARS = [
  ['Participar', 'Quem aparece, pergunta e responde é lembrado quando surgem oportunidades.'],
  ['Partilhar', 'Uma vaga, um link ou um erro que já cometeu podem poupar meses a outra pessoa.'],
  ['Ajudar primeiro', 'Ajudar sem esperar retorno é a forma mais rápida de construir uma rede que responde.'],
  ['Aprender em público', 'Mostrar o que está a estudar cria confiança e atrai quem está no mesmo caminho.'],
  ['Conexões genuínas', 'Dez relações reais valem mais do que mil contactos que não se lembram de si.'],
  ['Celebrar conquistas', 'Uma certificação, uma entrevista, um primeiro emprego: tudo conta e merece ser dito.'],
  ['Consistência', 'Um pouco todos os dias vence o esforço intenso de uma semana só.'],
  ['Ética', 'Respeito, verdade e confidencialidade, dentro e fora do grupo.'],
];

// Tempos (segundos). Por omissão 3,2 + 8 × 4,2 + 4,6; com narração vêm em ?dur=intro,c1,…,c8,fecho
const _dur = (new URLSearchParams(location.search).get('dur') || '').split(',').map(Number).filter(x => x > 0);
const DURS = _dur.length === 10 ? _dur : [3.2, 4.2, 4.2, 4.2, 4.2, 4.2, 4.2, 4.2, 4.2, 4.6];
const INTRO = DURS[0], SCENE_D = DURS.slice(1, 9), OUTRO = DURS[9];
const STARTS = SCENE_D.map((_, i) => INTRO + SCENE_D.slice(0, i).reduce((a, b) => a + b, 0));
const S0 = INTRO, OUT0 = INTRO + SCENE_D.reduce((a, b) => a + b, 0), DURATION = OUT0 + OUTRO;
window.DURATION = DURATION;
window.STARTS = [0, ...STARTS, OUT0];

// Easing cubic-bezier(.2,.7,.2,1)
function bezier(p1x, p1y, p2x, p2y) {
  const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
  const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => { let t = x; for (let i = 0; i < 6; i++) { const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= (sx(t) - x) / d; } return sy(Math.min(1, Math.max(0, t))); };
}
const ease = bezier(.2, .7, .2, 1);
const easeIO = bezier(.65, 0, .35, 1);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = (t, a, b) => ease(prog(t, a, b));
const lerp = (a, b, k) => a + (b - a) * k;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
const AMBER = '#FFB627', INK = '#F4F2EE', MUTE = '#A9AFB8';

// ─── Ilustrações (uma por pilar): build(svg, w, h) devolve update(u), u = segundos dentro da cena ───
const ILL = [
  // 1. Participar: um ponto entra e junta-se a um círculo de membros
  (svg, w, h) => {
    const cx = w / 2, cy = h / 2, R = 150, nodes = [], links = [];
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / 8;
      const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
      links.push(el('line', { x1: cx, y1: cy, x2: x, y2: y, stroke: 'rgba(255,255,255,.14)', 'stroke-width': 1.5 }, svg));
      nodes.push(el('circle', { cx: x, cy: y, r: 13, fill: '#1A1E26', stroke: 'rgba(255,255,255,.35)', 'stroke-width': 1.5 }, svg));
    }
    const slotA = -Math.PI / 2 + 7 * 2 * Math.PI / 8, sx = cx + R * Math.cos(slotA), sy = cy + R * Math.sin(slotA);
    const newLink = el('line', { x1: cx, y1: cy, x2: sx, y2: sy, stroke: AMBER, 'stroke-width': 2 }, svg);
    const core = el('circle', { cx, cy, r: 26, fill: 'rgba(255,182,39,.12)', stroke: AMBER, 'stroke-width': 2 }, svg);
    const dot = el('circle', { r: 15, fill: AMBER }, svg);
    const halo = el('circle', { r: 15, fill: 'none', stroke: AMBER, 'stroke-width': 2 }, svg);
    const label = el('text', { x: cx, y: h - 34, 'text-anchor': 'middle', fill: MUTE, 'font-size': 22 }, svg);
    label.textContent = 'Novo membro: pergunta enviada';
    return u => {
      nodes.forEach((n, i) => n.setAttribute('opacity', E(u, .1 + i * .06, .5 + i * .06)));
      links.forEach((l, i) => l.setAttribute('opacity', E(u, .2 + i * .06, .6 + i * .06)));
      const k = E(u, .9, 2.1);
      const x = lerp(w + 40, sx, k), y = lerp(-30, sy, k);
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      halo.setAttribute('cx', sx); halo.setAttribute('cy', sy);
      const hk = prog(u, 2.1, 3.0);
      halo.setAttribute('r', 15 + 34 * ease(hk)); halo.setAttribute('opacity', (1 - hk) * (u > 2.1 ? .8 : 0));
      const lk = E(u, 2.0, 2.7);
      newLink.setAttribute('x2', lerp(cx, sx, lk)); newLink.setAttribute('y2', lerp(cy, sy, lk)); newLink.setAttribute('opacity', lk);
      core.setAttribute('opacity', E(u, 0, .5));
      label.setAttribute('opacity', E(u, 2.3, 2.9));
    };
  },
  // 2. Partilhar: um cartão de vaga desliza de um nó para outro, deixando rasto
  (svg, w, h) => {
    const ax = 120, bx = w - 120, y = h / 2 + 10;
    el('line', { x1: ax, y1: y, x2: bx, y2: y, stroke: 'rgba(255,255,255,.12)', 'stroke-width': 1.5, 'stroke-dasharray': '4 8' }, svg);
    const trail = el('line', { x1: ax, y1: y, x2: ax, y2: y, stroke: AMBER, 'stroke-width': 2.5 }, svg);
    const A = el('circle', { cx: ax, cy: y, r: 22, fill: '#1A1E26', stroke: AMBER, 'stroke-width': 2 }, svg);
    const B = el('circle', { cx: bx, cy: y, r: 22, fill: '#1A1E26', stroke: 'rgba(255,255,255,.35)', 'stroke-width': 2 }, svg);
    const card = el('g', {}, svg);
    el('rect', { x: -130, y: -64, width: 260, height: 128, rx: 16, fill: '#151920', stroke: 'rgba(255,255,255,.18)' }, card);
    el('rect', { x: -106, y: -40, width: 38, height: 38, rx: 10, fill: 'rgba(255,182,39,.18)', stroke: AMBER }, card);
    const t1 = el('text', { x: -54, y: -14, fill: INK, 'font-size': 20, 'font-weight': 600 }, card); t1.textContent = 'Vaga: Project Manager';
    const t2 = el('text', { x: -54, y: 12, fill: MUTE, 'font-size': 17 }, card); t2.textContent = 'Lisboa · híbrido';
    el('rect', { x: -106, y: 30, width: 150, height: 8, rx: 4, fill: 'rgba(255,255,255,.12)' }, card);
    return u => {
      A.setAttribute('opacity', E(u, .1, .5)); B.setAttribute('opacity', E(u, .2, .6));
      const k = easeIO(prog(u, .9, 2.6));
      const cx = lerp(ax, bx, k), cy = y - 110 - Math.sin(k * Math.PI) * 30;
      card.setAttribute('transform', `translate(${cx} ${cy})`);
      card.setAttribute('opacity', E(u, .5, 1.0));
      trail.setAttribute('x2', lerp(ax, bx, k));
      const lit = E(u, 2.5, 3.0);
      B.setAttribute('stroke', lit > .5 ? AMBER : 'rgba(255,255,255,.35)');
      B.setAttribute('fill', `rgba(255,182,39,${.18 * lit})`);
    };
  },
  // 3. Ajudar primeiro: um nó acende outro, sem esperar nada de volta
  (svg, w, h) => {
    const p = [[150, h / 2 + 60], [w / 2, h / 2 - 90], [w - 150, h / 2 + 60]];
    const lines = [[0, 1], [1, 2]].map(([a, b]) => el('line', { x1: p[a][0], y1: p[a][1], x2: p[b][0], y2: p[b][1], stroke: 'rgba(255,255,255,.12)', 'stroke-width': 1.5 }, svg));
    const pulses = [0, 1].map(() => el('circle', { r: 7, fill: AMBER }, svg));
    const nodes = p.map(([x, y], i) => el('circle', { cx: x, cy: y, r: 30, fill: '#1A1E26', stroke: i === 0 ? AMBER : 'rgba(255,255,255,.3)', 'stroke-width': 2 }, svg));
    const rings = p.map(([x, y]) => el('circle', { cx: x, cy: y, r: 30, fill: 'none', stroke: AMBER, 'stroke-width': 1.5 }, svg));
    return u => {
      nodes.forEach((n, i) => n.setAttribute('opacity', E(u, .1 + i * .1, .5 + i * .1)));
      lines.forEach((l, i) => l.setAttribute('opacity', E(u, .3 + i * .1, .8)));
      [[0, 1, .9], [1, 2, 2.0]].forEach(([a, b, s], i) => {
        const k = easeIO(prog(u, s, s + .9));
        pulses[i].setAttribute('cx', lerp(p[a][0], p[b][0], k)); pulses[i].setAttribute('cy', lerp(p[a][1], p[b][1], k));
        pulses[i].setAttribute('opacity', k > 0 && k < 1 ? 1 : 0);
        const on = prog(u, s + .85, s + 1.2);
        if (on > 0) { nodes[b].setAttribute('stroke', AMBER); nodes[b].setAttribute('fill', `rgba(255,182,39,${.16 * on})`); }
        else { nodes[b].setAttribute('stroke', 'rgba(255,255,255,.3)'); nodes[b].setAttribute('fill', '#1A1E26'); }
        const rk = prog(u, s + .85, s + 1.8);
        rings[b].setAttribute('r', 30 + 40 * ease(rk)); rings[b].setAttribute('opacity', u > s + .85 ? (1 - rk) * .7 : 0);
      });
      rings[0].setAttribute('opacity', 0);
    };
  },
  // 4. Aprender em público: notas de estudo a escrever-se, com progresso visível
  (svg, w, h) => {
    const x0 = 70;
    const chip = el('g', {}, svg);
    el('rect', { x: x0, y: 40, width: 230, height: 44, rx: 22, fill: 'rgba(255,182,39,.12)', stroke: AMBER }, chip);
    const ct = el('text', { x: x0 + 24, y: 69, fill: AMBER, 'font-size': 19, 'font-weight': 600 }, chip); ct.textContent = 'A estudar: PSM I';
    const lines = [430, 520, 380, 470, 300].map((len, i) => el('rect', { x: x0, y: 130 + i * 50, width: 0, height: 12, rx: 6, fill: i === 0 ? 'rgba(244,242,238,.5)' : 'rgba(255,255,255,.16)', 'data-len': len }, svg));
    el('rect', { x: x0, y: h - 80, width: w - 140, height: 10, rx: 5, fill: 'rgba(255,255,255,.1)' }, svg);
    const pb = el('rect', { x: x0, y: h - 80, width: 0, height: 10, rx: 5, fill: AMBER }, svg);
    const pt = el('text', { x: w - 70, y: h - 100, 'text-anchor': 'end', fill: MUTE, 'font-size': 19 }, svg);
    const caret = el('rect', { width: 3, height: 22, fill: AMBER }, svg);
    return u => {
      chip.setAttribute('opacity', E(u, .1, .6));
      let cx = x0, cy = 130;
      lines.forEach((l, i) => {
        const k = E(u, .5 + i * .45, 1.0 + i * .45);
        const len = +l.getAttribute('data-len') * k;
        l.setAttribute('width', len);
        if (k > 0 && k < 1) { cx = x0 + len; cy = 130 + i * 50; }
        else if (k >= 1) { cx = x0 + len; cy = 130 + i * 50; }
      });
      caret.setAttribute('x', cx + 6); caret.setAttribute('y', cy - 5);
      caret.setAttribute('opacity', u > .5 && u < 3.4 ? .9 : 0);
      const pk = E(u, .6, 3.2);
      pb.setAttribute('width', (w - 140) * .68 * pk);
      pt.textContent = `Progresso ${Math.round(68 * pk)}%`;
      pt.setAttribute('opacity', E(u, .4, .9));
    };
  },
  // 5. Conexões genuínas: muitos contactos ténues dão lugar a poucas ligações fortes
  (svg, w, h) => {
    const cx = w / 2, cy = h / 2;
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const faint = [];
    for (let i = 0; i < 46; i++) {
      const a = rnd() * Math.PI * 2, r = 90 + rnd() * 150;
      faint.push(el('circle', { cx: cx + Math.cos(a) * r * 1.35, cy: cy + Math.sin(a) * r * .85, r: 4, fill: 'rgba(255,255,255,.35)' }, svg));
    }
    const strong = [[-210, -110], [200, -90], [-140, 130], [190, 120]].map(([dx, dy]) => [cx + dx, cy + dy]);
    const links = strong.map(([x, y]) => el('line', { x1: cx, y1: cy, x2: cx, y2: cy, stroke: AMBER, 'stroke-width': 2.5 }, svg));
    const nodes = strong.map(([x, y]) => el('circle', { cx: x, cy: y, r: 16, fill: '#1A1E26', stroke: AMBER, 'stroke-width': 2 }, svg));
    const me = el('circle', { cx, cy, r: 24, fill: 'rgba(255,182,39,.15)', stroke: AMBER, 'stroke-width': 2.5 }, svg);
    return u => {
      const fadeOut = E(u, 1.4, 2.4);
      faint.forEach((f, i) => f.setAttribute('opacity', E(u, .05 + (i % 10) * .04, .5 + (i % 10) * .04) * (1 - fadeOut * .85)));
      me.setAttribute('opacity', E(u, .1, .6));
      strong.forEach(([x, y], i) => {
        const k = E(u, 1.6 + i * .2, 2.3 + i * .2);
        links[i].setAttribute('x2', lerp(cx, x, k)); links[i].setAttribute('y2', lerp(cy, y, k)); links[i].setAttribute('opacity', k);
        nodes[i].setAttribute('opacity', E(u, 1.9 + i * .2, 2.4 + i * .2));
      });
    };
  },
  // 6. Celebrar conquistas: um selo de conquista e um rasto âmbar a subir
  (svg, w, h) => {
    const cx = w / 2, cy = h / 2 + 30;
    const trail = el('line', { x1: cx, y1: h + 20, x2: cx, y2: h + 20, stroke: AMBER, 'stroke-width': 3, 'stroke-linecap': 'round' }, svg);
    const badge = el('g', {}, svg);
    el('circle', { cx: 0, cy: 0, r: 70, fill: 'rgba(255,182,39,.12)', stroke: AMBER, 'stroke-width': 2.5 }, badge);
    const check = el('path', { d: 'M -28 2 L -8 22 L 30 -18', fill: 'none', stroke: AMBER, 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': 90, 'stroke-dashoffset': 90 }, badge);
    const labels = ['Certificação', 'Entrevista', 'Primeiro emprego'];
    const chips = labels.map((t, i) => {
      const g = el('g', {}, svg);
      const wv = 30 + t.length * 11;
      el('rect', { x: -wv / 2, y: -20, width: wv, height: 40, rx: 20, fill: '#151920', stroke: 'rgba(255,255,255,.2)' }, g);
      const tx = el('text', { x: 0, y: 7, 'text-anchor': 'middle', fill: INK, 'font-size': 18, 'font-weight': 500 }, g); tx.textContent = t;
      return g;
    });
    const sparks = Array.from({ length: 9 }, () => el('circle', { r: 3.5, fill: AMBER }, svg));
    return u => {
      const tk = E(u, .2, 1.1);
      trail.setAttribute('y2', lerp(h + 20, cy + 70, tk)); trail.setAttribute('opacity', 1 - E(u, 1.3, 2.0) * .8);
      badge.setAttribute('transform', `translate(${cx} ${cy}) scale(${.6 + .4 * E(u, .9, 1.5)})`);
      badge.setAttribute('opacity', E(u, .9, 1.4));
      check.setAttribute('stroke-dashoffset', 90 * (1 - E(u, 1.3, 1.9)));
      chips.forEach((g, i) => {
        const k = E(u, 1.9 + i * .25, 2.5 + i * .25);
        const x = cx + (i - 1) * 220, y = cy - 140 - (i === 1 ? 26 : 0);
        g.setAttribute('transform', `translate(${x} ${y + (1 - k) * 18})`); g.setAttribute('opacity', k);
      });
      sparks.forEach((s, i) => {
        const a = -Math.PI / 2 + (i - 4) * .32, k = prog(u, 1.4, 2.6);
        const r = 80 + 120 * ease(k);
        s.setAttribute('cx', cx + Math.cos(a) * r); s.setAttribute('cy', cy + Math.sin(a) * r);
        s.setAttribute('opacity', k > 0 ? (1 - k) * .9 : 0);
      });
    };
  },
  // 7. Consistência: os dias da semana a encherem-se, um de cada vez
  (svg, w, h) => {
    const days = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
    const size = 70, gap = 18, total = days.length * size + (days.length - 1) * gap, x0 = (w - total) / 2, y0 = h / 2 - 70;
    const cells = days.map((d, i) => {
      const x = x0 + i * (size + gap);
      el('text', { x: x + size / 2, y: y0 - 18, 'text-anchor': 'middle', fill: MUTE, 'font-size': 18 }, svg).textContent = d;
      el('rect', { x, y: y0, width: size, height: size, rx: 14, fill: 'rgba(255,255,255,.05)', stroke: 'rgba(255,255,255,.14)' }, svg);
      return el('rect', { x, y: y0, width: size, height: size, rx: 14, fill: AMBER }, svg);
    });
    el('rect', { x: x0, y: y0 + size + 70, width: total, height: 10, rx: 5, fill: 'rgba(255,255,255,.1)' }, svg);
    const bar = el('rect', { x: x0, y: y0 + size + 70, width: 0, height: 10, rx: 5, fill: AMBER }, svg);
    const lbl = el('text', { x: x0, y: y0 + size + 125, fill: MUTE, 'font-size': 19 }, svg);
    return u => {
      let filled = 0;
      cells.forEach((c, i) => {
        const k = E(u, .5 + i * .32, .8 + i * .32);
        c.setAttribute('opacity', k * (i === 5 || i === 6 ? .55 : .9));
        c.setAttribute('transform', `translate(${c.getAttribute('x') * (1 - (.85 + .15 * k))} ${c.getAttribute('y') * (1 - (.85 + .15 * k))}) scale(${.85 + .15 * k})`);
        if (k > .5) filled++;
      });
      bar.setAttribute('width', total * E(u, .5, 2.9));
      lbl.textContent = `${filled} de 7 dias · 20 minutos por dia`;
      lbl.setAttribute('opacity', E(u, .4, .9));
    };
  },
  // 8. Ética: uma estrutura simétrica e estável a encaixar no lugar
  (svg, w, h) => {
    const cx = w / 2, cy = h / 2 + 10;
    const paths = [
      `M ${cx} ${cy - 150} L ${cx + 130} ${cy - 90} L ${cx + 130} ${cy + 20} Q ${cx + 130} ${cy + 120} ${cx} ${cy + 170} Q ${cx - 130} ${cy + 120} ${cx - 130} ${cy + 20} L ${cx - 130} ${cy - 90} Z`,
      `M ${cx} ${cy - 110} L ${cx} ${cy + 130}`,
      `M ${cx - 90} ${cy - 20} L ${cx + 90} ${cy - 20}`,
    ].map((d, i) => el('path', { d, fill: i === 0 ? 'rgba(255,182,39,0)' : 'none', stroke: i === 0 ? AMBER : 'rgba(244,242,238,.55)', 'stroke-width': i === 0 ? 3 : 2, 'stroke-linejoin': 'round', 'stroke-dasharray': 1400, 'stroke-dashoffset': 1400 }, svg));
    const words = ['Respeito', 'Verdade', 'Confidencialidade'].map((t, i) => {
      const x = i === 0 ? cx - 250 : i === 1 ? cx + 250 : cx;
      const y = i === 2 ? cy + 225 : cy - 40;
      const tx = el('text', { x, y, 'text-anchor': 'middle', fill: INK, 'font-size': 22, 'font-weight': 600 }, svg);
      tx.textContent = t; return tx;
    });
    return u => {
      paths.forEach((p, i) => p.setAttribute('stroke-dashoffset', 1400 * (1 - E(u, .3 + i * .4, 1.6 + i * .4))));
      paths[0].setAttribute('fill', `rgba(255,182,39,${.1 * E(u, 1.8, 2.6)})`);
      words.forEach((t, i) => t.setAttribute('opacity', E(u, 2.0 + i * .25, 2.6 + i * .25)));
    };
  },
];

// ─── Cenas ───
const pad = n => String(n).padStart(2, '0');
const scenesEl = document.getElementById('scenes');
const scenes = PILLARS.map(([title, text], i) => {
  const s = document.createElement('div');
  s.className = 'scene';
  s.innerHTML = `
    <div class="copy">
      <svg class="num" viewBox="0 0 420 230"><text x="6" y="205" fill="${AMBER}" fill-opacity="0" stroke="${AMBER}" stroke-width="3" stroke-dasharray="1200" stroke-dashoffset="1200">${pad(i + 1)}</text></svg>
      <h3 class="h">${title}</h3>
      <p>${text}</p>
    </div>
    <div class="panel"><svg></svg></div>`;
  scenesEl.appendChild(s);
  const svg = s.querySelector('.panel svg');
  const w = VERT ? 920 : 760, h = VERT ? 566 : 486;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  return { s, num: s.querySelector('.num text'), h3: s.querySelector('h3'), p: s.querySelector('p'), panel: s.querySelector('.panel'), update: ILL[i](svg, w, h) };
});

// Anel do fecho: 8 nós ligados
const ring = document.getElementById('ring');
const ringNodes = [], ringLinks = [];
for (let i = 0; i < 8; i++) {
  const a = -Math.PI / 2 + i * Math.PI / 4, b = -Math.PI / 2 + (i + 1) * Math.PI / 4, R = 240;
  ringLinks.push(el('line', { x1: R * Math.cos(a), y1: R * Math.sin(a), x2: R * Math.cos(b), y2: R * Math.sin(b), stroke: AMBER, 'stroke-width': 2 }, ring));
}
for (let i = 0; i < 8; i++) {
  const a = -Math.PI / 2 + i * Math.PI / 4, R = 240;
  const g = el('g', { transform: `translate(${R * Math.cos(a)} ${R * Math.sin(a)})` }, ring);
  el('circle', { r: 30, fill: '#14171D', stroke: AMBER, 'stroke-width': 2 }, g);
  const t = el('text', { y: 8, 'text-anchor': 'middle', fill: AMBER, 'font-size': 22, 'font-weight': 700, 'font-family': 'Plus Jakarta Sans' }, g); t.textContent = pad(i + 1);
  ringNodes.push(g);
}
const ringCore = el('circle', { r: 70, fill: 'rgba(255,182,39,.1)', stroke: 'rgba(255,182,39,.5)', 'stroke-width': 1.5 }, ring);

// Marcas na linha contínua
const rail = document.getElementById('rail');
for (let i = 0; i <= 8; i++) { const t = document.createElement('div'); t.className = 'tick'; t.style.left = `${i / 8 * 100}%`; rail.appendChild(t); }

const $ = id => document.getElementById(id);

// ─── Texto escrito ao ritmo da voz ───
const normW = w => w.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
function timesFor(sceneIdx, words) {
  const list = window.WORD_TIMES && window.WORD_TIMES.scenes && window.WORD_TIMES.scenes[sceneIdx];
  if (!list) return null;
  const nl = list.map(x => normW(x[0])), nw = words.map(normW);
  for (let s = 0; s <= nl.length - nw.length; s++) {
    if (nw.every((x, k) => nl[s + k] === x)) return nw.map((_, k) => list[s + k][1]);
  }
  return null;
}
function wrapWords(pEl, sceneIdx) {
  const words = pEl.textContent.trim().split(/\s+/);
  const times = timesFor(sceneIdx, words);
  if (!times) return null;
  pEl.innerHTML = words.map(w => `<span class="w">${w}</span>`).join(' ');
  const cur = document.createElement('span'); cur.className = 'cur';
  return { spans: [...pEl.querySelectorAll('.w')], cur, times };
}
// u: segundos desde o início da cena. As palavras aparecem quando são ditas (0,12 s de entrada) e o cursor vai à frente.
function revealWords(r, u) {
  if (!r) return;
  let k = -1;
  r.spans.forEach((s, i) => {
    const op = clamp((u - r.times[i]) / .12);
    s.style.opacity = op;
    s.classList.toggle('said', op > 0);
    if (u >= r.times[i]) k = i;
  });
  const anchor = k >= 0 ? r.spans[k] : r.spans[0];
  if (k >= 0) { if (anchor.nextSibling !== r.cur) anchor.after(r.cur); }
  else if (anchor.previousSibling !== r.cur) anchor.before(r.cur);
  const first = r.times[0], last = r.times[r.times.length - 1];
  const on = E(u, first - .35, first) * (1 - E(u, last + .7, last + 1.1));
  r.cur.style.opacity = on * (.8 + .2 * Math.cos(2 * Math.PI * u));   // pulso suave a 1 Hz (sem piscar)
}
const introReveal = wrapWords(document.querySelector('#intro p'), 0);
const sceneReveal = scenes.map((sc, i) => wrapWords(sc.p, i + 1));
const outroReveal = wrapWords(document.querySelector('#outro p'), 9);
const ctaTime = (() => { const r = timesFor(9, ['Entre', 'na', 'comunidade']); return r ? r[0] : null; })();
const setT = (node, opacity, x = 0, y = 0, s = 1) => { node.style.opacity = opacity; node.style.transform = `translate(${x}px, ${y}px) scale(${s})`; };

// ─── Desenhar o instante t (segundos) ───
window.render = function render(t) {
  // câmara: aproximação lenta contínua e brilho a acompanhar a cena
  const cam = $('cam');
  cam.style.transform = `scale(${1.02 + .04 * (t / DURATION)}) translate(${-20 * Math.sin(t / 7)}px, ${-12 * Math.cos(t / 9)}px)`;
  const glow = $('glow');
  const gx = VERT ? 540 : 1280 + 140 * Math.sin(t / 5), gy = VERT ? 1180 : 520 + 60 * Math.cos(t / 6);
  glow.style.left = `${gx - 550}px`; glow.style.top = `${gy - 550}px`;

  // abertura
  const intro = $('intro');
  const iIn = E(t, .2, 1.2), iOut = E(t, INTRO - .55, INTRO + .05);
  setT(intro, iIn * (1 - iOut), 0, (1 - iIn) * 30 - iOut * 30);
  intro.querySelector('.eyebrow').style.opacity = E(t, .15, .8);
  if (introReveal) { intro.querySelector('p').style.opacity = 1; revealWords(introReveal, t); }
  else intro.querySelector('p').style.opacity = E(t, .7, 1.5);

  // barra de topo e linha contínua
  let active = 0;
  STARTS.forEach((s, i) => { if (t >= s) active = i; });
  const sceneProgress = clamp((active + clamp((t - STARTS[active]) / SCENE_D[active])) / 8);
  const topOn = E(t, INTRO - .4, INTRO + .3) * (1 - E(t, OUT0 + .2, OUT0 + .8));
  $('top').style.opacity = topOn;
  $('counter').innerHTML = `<b>${pad(active + 1)}</b> / 08`;
  $('bar').style.transform = `scaleX(${(active + E(t, STARTS[active], STARTS[active] + .6)) / 8})`;
  $('rail').style.opacity = E(t, INTRO - .3, INTRO + .4);
  const railK = t >= OUT0 ? 1 : sceneProgress;
  $('railFill').style.transform = `scaleX(${railK})`;
  $('railHead').style.left = `${railK * 100}%`;

  // cenas
  scenes.forEach((sc, i) => {
    const s = STARTS[i], u = t - s, D = SCENE_D[i];
    const inK = E(u, -.15, .65), outK = E(u, D - .55, D + .05);
    const vis = u > -.2 && u < D + .1;
    sc.s.style.display = vis ? 'grid' : 'none';
    if (!vis) return;
    sc.s.style.opacity = inK * (1 - outK);
    sc.s.style.transform = `translate(${(1 - inK) * 40 - outK * 40}px, 0)`;
    // número: contorno a desenhar-se e depois preenchimento
    sc.num.setAttribute('stroke-dashoffset', 1200 * (1 - E(u, 0, 1.3)));
    sc.num.setAttribute('fill-opacity', E(u, .9, 1.7));
    setT(sc.h3, E(u, .25, .95), 0, (1 - E(u, .25, .95)) * 22);
    if (sceneReveal[i]) { setT(sc.p, 1); revealWords(sceneReveal[i], u); }
    else setT(sc.p, E(u, .45, 1.15), 0, (1 - E(u, .45, 1.15)) * 22);
    const pk = E(u, .15, .9);
    sc.panel.style.opacity = pk;
    sc.panel.style.transform = `translateY(${(1 - pk) * 30}px) scale(${.97 + .03 * pk})`;
    sc.update(u);
  });

  // fecho
  const o = t - OUT0;
  const outro = $('outro');
  outro.style.display = o > -.3 ? 'flex' : 'none';
  const oIn = E(o, 0, .9);
  setT(outro, oIn, 0, (1 - oIn) * 30);
  if (outroReveal) { outro.querySelector('p').style.opacity = 1; revealWords(outroReveal, o); }
  else outro.querySelector('p').style.opacity = E(o, .5, 1.2);
  outro.querySelector('.cta').style.opacity = ctaTime !== null ? E(o, ctaTime - .15, ctaTime + .35) : E(o, .9, 1.6);
  ringNodes.forEach((g, i) => g.setAttribute('opacity', E(o, .2 + i * .12, .6 + i * .12)));
  ringLinks.forEach((l, i) => l.setAttribute('opacity', E(o, .6 + i * .12, 1.0 + i * .12)));
  ringCore.setAttribute('opacity', E(o, 1.4, 2.2));
};

// Pré-visualização em tempo real (a gravação usa render(t) fotograma a fotograma)
window.ready = document.fonts.ready.then(() => true);
if (!new URLSearchParams(location.search).has('record')) {
  window.ready.then(() => {
    const start = performance.now();
    const loop = now => { window.render(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
